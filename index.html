<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnwordChat</title>
  <style>
    /* 欢迎区、输入框、发送按钮和问题气泡改编自 DeepSeek chat-demo：
       https://github.com/deepseek-ai/chat-demo/tree/429af5a4558469496b231631e850fbccc0c30c87/src/components
       session/Welcome.module.css、chatInput/ChatInput.module.css、messages/UserMessage.module.css。
       上游 MIT 许可全文见本文件末尾。 */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      color: #222631;
      background: #fff;
      font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      --blue: #3964fe;
    }
    aside {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 22px 14px;
      background: #f7f8fb;
      border-right: 1px solid #ebedf2;
    }
    aside button {
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    #new-chat { background: #e9efff; color: #294fcb; font-weight: 600; }
    aside h2 { margin: 12px 12px 0; color: #626773; font-size: 13px; }
    #history { display: flex; flex-direction: column; gap: 3px; overflow: auto; }
    #history button { flex: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #history button:hover:enabled { background: #eceff5; }
    #history button[aria-current="true"] { background: #e4eaf9; color: #284cae; }
    #storage-notice { margin: 0; }
    #logout { margin-top: auto; color: #525968; white-space: nowrap; }
    #auth {
      grid-column: 1 / -1; grid-row: 1 / -1; align-self: center;
      width: min(340px, calc(100% - 40px)); margin: auto;
    }
    body:has(#auth:not([hidden])) { min-height: 100dvh; background: #f7f8fb; }
    #auth h1 { text-align: left; }
    #auth label { display: block; margin-top: 14px; font-size: 14px; }
    #auth input {
      display: block; width: 100%; margin-top: 4px; padding: 10px 12px;
      border: 1px solid #c9ced9; border-radius: 10px; font: inherit;
    }
    #auth button { padding: 10px 16px; border: 0; border-radius: 10px; font: inherit; cursor: pointer; }
    #auth-submit { background: var(--blue); color: white; }
    #auth-switch { background: transparent; color: #294fcb; }
    #auth .auth-actions { display: flex; gap: 8px; margin-top: 20px; }
    main {
      width: min(100%, 800px);
      height: 100dvh;
      margin: auto;
      padding: 20px clamp(16px, 4vw, 32px) max(20px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.3;
      font-weight: 600;
      text-align: center;
    }
    h1 span { color: var(--blue); }
    main.chatting h1 {
      margin-bottom: 0;
      padding-bottom: 14px;
      border-bottom: 1px solid #ebedf2;
      text-align: left;
      font-size: 18px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 4px 20px;
      overflow-wrap: anywhere;
    }
    .turn + .turn { margin-top: 28px; }
    .asked {
      width: fit-content;
      max-width: calc(100% - 68px);
      margin: 0 0 24px auto;
      padding: 10px 16px;
      border-radius: 22px;
      line-height: 24px;
      background: #edf3fe;
      white-space: pre-wrap;
    }
    .answer { margin: 6px 0 0; white-space: pre-wrap; line-height: 1.75; }
    .status { color: #626773; font-size: 14px; }
    #chat {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 24px;
      background: white;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .02), 0 2px 2px rgba(72, 104, 178, .01),
                  0 30px 60px rgba(72, 104, 178, .03);
    }
    #chat:focus-within { border-color: #849fff; }
    textarea {
      width: 100%;
      padding: 14px 16px 0;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 24px;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px 12px 16px;
      color: #626773;
      font-size: 12px;
    }
    #chat button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font: 24px/1 system-ui, sans-serif;
      cursor: pointer;
    }
    #chat button:hover:enabled { background: #3054d5; }
    button:disabled { opacity: .4; cursor: default; }
    @media (pointer: coarse) {
      .shortcut { visibility: hidden; }
      #chat button { width: 44px; height: 44px; }
    }
    @media (max-width: 640px) {
      body { height: 100dvh; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
      aside { height: auto; padding: 8px 12px; flex-direction: row; align-items: center; gap: 8px; border: 0; border-bottom: 1px solid #ebedf2; }
      aside h2 { display: none; }
      #new-chat { flex: none; }
      #history { flex-direction: row; }
      #history button { max-width: 12em; }
      #logout { margin: 0 0 0 auto; }
      main { height: 100%; }
    }
  </style>
</head>
<body>
  <form id="auth" hidden>
    <h1><span>OnwordChat</span></h1>
    <label>用户名<input name="username" autocomplete="username" maxlength="50" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label>
    <div class="auth-actions">
      <button id="auth-submit" type="submit">登录</button>
      <button id="auth-switch" type="button">注册新账号</button>
    </div>
    <p class="status" id="auth-status" role="status"></p>
  </form>
  <aside aria-label="会话导航" hidden>
    <button id="new-chat" type="button">＋ 新对话</button>
    <h2>历史对话</h2>
    <nav id="history" aria-label="历史对话"></nav>
    <button id="logout" type="button">退出登录</button>
  </aside>
  <main hidden>
    <h1><span>OnwordChat</span></h1>
    <section id="messages" aria-label="聊天记录" hidden></section>
    <template id="turn-template">
      <div class="turn">
        <p class="asked" aria-label="你的问题"></p>
        <strong>OnwordChat</strong>
        <p class="answer"></p>
        <div class="status" role="status"></div>
      </div>
    </template>
    <form id="chat">
      <textarea id="question" rows="2" aria-label="问题" placeholder="输入你的问题……" required></textarea>
      <div class="actions">
        <span class="shortcut">Enter 发送 · Shift + Enter 换行</span>
        <button type="submit" aria-label="发送问题" title="发送问题" disabled>↑</button>
      </div>
    </form>
    <p id="storage-notice" class="status" role="status"></p>
  </main>
  <script>
    const form = document.querySelector("#chat");
    const input = document.querySelector("#question");
    const button = form.querySelector("button");
    const messages = document.querySelector("#messages");
    const turnTemplate = document.querySelector("#turn-template");
    const newChat = document.querySelector("#new-chat");
    const historyList = document.querySelector("#history");
    const storageNotice = document.querySelector("#storage-notice");
    const auth = document.querySelector("#auth");
    const authStatus = document.querySelector("#auth-status");
    const authSubmit = document.querySelector("#auth-submit");
    const authSwitch = document.querySelector("#auth-switch");
    const logout = document.querySelector("#logout");
    let registering = false;
    let selectedKey;
    let chats = [];
    let currentId = "";

    // 同一站点的标签页共用登录 Cookie。登录或退出时，通知其他标签页重新确认账号。
    const accountChanges = window.BroadcastChannel ? new BroadcastChannel("onwordchat-account") : null;
    if (accountChanges) accountChanges.onmessage = () => location.reload();
    window.addEventListener("pageshow", event => {
      // 浏览器后退时可能恢复整页快照，重新加载以免显示上一个账号的聊天。
      if (event.persisted) location.reload();
    });

    function refreshAccount() {
      accountChanges?.postMessage("changed");
      location.reload();
    }

    function setRegistering(value) {
      registering = value;
      authSubmit.textContent = value ? "注册" : "登录";
      authSwitch.textContent = value ? "返回登录" : "注册新账号";
      auth.elements.password.autocomplete = value ? "new-password" : "current-password";
      authStatus.textContent = value ? "请设置 8 至 128 位密码。" : "";
    }

    authSwitch.onclick = () => setRegistering(!registering);
    auth.onsubmit = async event => {
      event.preventDefault();
      if (authSubmit.disabled) return;
      authSubmit.disabled = authSwitch.disabled = true;
      authStatus.textContent = "";
      try {
        const response = await fetch(registering ? "/api/auth/register" : "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: auth.elements.username.value.trim(), password: auth.elements.password.value })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          authStatus.textContent = typeof error.detail === "string" ? error.detail : "提交失败，请检查输入后重试。";
          return;
        }
        if (registering) {
          // 注册接口只创建账号，用户还要登录一次才能拿到会话 Cookie。
          setRegistering(false);
          authStatus.textContent = "注册成功，请点击登录。";
        } else {
          auth.reset();
          refreshAccount();
        }
      } catch {
        authStatus.textContent = "连接失败，请稍后重试。";
      } finally {
        authSubmit.disabled = authSwitch.disabled = false;
      }
    };

    logout.onclick = async () => {
      setBusy(true);
      try {
        const response = await fetch("/api/auth/logout", { method: "POST" });
        if (!response.ok) throw new Error();
        refreshAccount();
      } catch {
        storageNotice.textContent = "退出失败，请重试。";
        setBusy(false);
      }
    };

    async function chatRequest(url, options) {
      const response = await fetch(url, { cache: "no-store", ...options });
      if (response.status === 401) {
        // 登录过期后重新走页面初始化流程，回到登录表单。
        location.reload();
        throw new Error("请重新登录");
      }
      return response;
    }

    async function readHistory(url) {
      const response = await chatRequest(url);
      if (!response.ok) throw new Error("读取历史记录失败");
      return response.json();
    }

    // 会话和消息由后端保存。浏览器只记住上次打开的会话 ID。
    function rememberSelection() {
      try {
        localStorage.setItem(selectedKey, currentId);
      } catch {
        storageNotice.textContent = "浏览器无法记住当前会话，刷新后请从历史列表打开。";
      }
    }

    function renderHistory() {
      historyList.replaceChildren();
      newChat.disabled = input.readOnly;
      for (const chat of chats) {
        const item = document.createElement("button");
        item.type = "button";
        item.textContent = chat.title;
        item.setAttribute("aria-current", String(chat.id === currentId));
        item.disabled = input.readOnly;
        item.onclick = () => selectChat(chat.id);
        historyList.append(item);
      }
    }

    function appendTurn(question) {
      const row = turnTemplate.content.firstElementChild.cloneNode(true);
      row.querySelector(".asked").textContent = question;
      messages.append(row);
      return row;
    }

    function showMessages(history) {
      messages.replaceChildren();
      messages.hidden = !currentId;
      document.querySelector("main").classList.toggle("chatting", Boolean(currentId));
      let row = null;
      // 后端按时间顺序返回消息；遇到提问就新建一轮，再把回答填到这一轮。
      for (const message of history) {
        if (message.role === "user") {
          row = appendTurn(message.content);
          row.querySelector(".status").textContent = "尚无已保存的回答。";
        } else if (message.role === "assistant") {
          if (!row) {
            row = appendTurn("");
            row.querySelector(".asked").hidden = true;
          }
          row.querySelector(".answer").textContent = message.content;
          row.querySelector(".status").textContent = "";
          row = null;
        }
      }
      messages.scrollTop = messages.scrollHeight;
    }

    function setBusy(busy) {
      input.readOnly = busy;
      logout.disabled = busy;
      renderHistory();
      updateButton();
    }

    async function selectChat(id) {
      setBusy(true);
      storageNotice.textContent = id ? "正在读取对话……" : "";
      try {
        let history = [];
        if (id) history = await readHistory("/api/conversations/" + encodeURIComponent(id) + "/messages");
        currentId = id;
        input.value = "";
        showMessages(history);
        storageNotice.textContent = "";
        rememberSelection();
      } catch {
        storageNotice.textContent = "对话读取失败，请再点一次历史标题。";
      } finally {
        setBusy(false);
      }
    }

    async function loadHistory() {
      setBusy(true);
      try {
        chats = await readHistory("/api/conversations");
        let selectedId;
        try {
          selectedId = localStorage.getItem(selectedKey);
        } catch {
          storageNotice.textContent = "请从历史列表选择会话。";
        }
        // 上次打开的会话可能已被删除，只恢复当前列表里仍存在的会话。
        if (chats.some(chat => chat.id === selectedId)) await selectChat(selectedId);
      } catch {
        storageNotice.textContent = "历史记录加载失败，请刷新重试。";
      } finally {
        setBusy(false);
      }
    }

    newChat.onclick = async () => {
      await selectChat("");
      input.focus();
    };
    // 打开页面时先向后端确认当前用户，登录成功后再加载这个账号的历史。
    async function start() {
      try {
        const response = await fetch("/api/auth/me", { cache: "no-store" });
        if (response.status === 401) {
          auth.hidden = false;
          return;
        }
        if (!response.ok) throw new Error();
        const user = await response.json();
        // 用用户 ID 区分本地存储的键，同一浏览器里的账号可以各自记住上次的会话。
        selectedKey = "onwordchat.selectedChat." + user.id;
        document.querySelector("aside").hidden = false;
        document.querySelector("main").hidden = false;
        await loadHistory();
      } catch {
        auth.hidden = false;
        authStatus.textContent = "无法读取登录状态，请刷新重试。";
      }
    }
    start();

    function updateButton() {
      button.disabled = input.readOnly || !input.value.trim();
    }
    input.addEventListener("input", updateButton);
    input.addEventListener("keydown", (event) => {
      // 中文输入法确认候选字时也会按 Enter。
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
        event.preventDefault();
        if (!event.repeat) form.requestSubmit();
      }
    });

    form.onsubmit = async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || input.readOnly) return;

      setBusy(true);
      storageNotice.textContent = "";
      input.value = "";
      const newConversation = !currentId || !chats.some(chat => chat.id === currentId);
      document.querySelector("main").classList.add("chatting");
      messages.hidden = false;
      const row = appendTurn(question);
      const answer = row.querySelector(".answer");
      const status = row.querySelector(".status");
      status.textContent = "正在回答……";
      messages.scrollTop = messages.scrollHeight;

      try {
        // 首问传 null，由后端创建会话；追问带回上次响应的 chatId，接着这段历史回答。
        const response = await chatRequest("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, chatId: currentId || null })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => null);
          const detail = typeof error?.detail === "string" ? error.detail : "请稍后重试。";
          if (response.status === 404 && detail === "会话不存在" && currentId) {
            // 清掉失效的会话 ID，保留原问题，下一次发送会创建新会话。
            chats = chats.filter(chat => chat.id !== currentId);
            currentId = "";
            rememberSelection();
            showMessages([]);
            input.value = question;
            storageNotice.textContent = "原会话已不可用，已切换到新对话。点击发送可重新提问。";
            return;
          }
          throw new Error(`发送失败（HTTP ${response.status}）：${detail}`);
        }
        const data = await response.json().catch(() => null);
        if (!data?.chatId || typeof data.answer !== "string" || !data.answer.trim()) {
          throw new Error("服务返回的回答或会话 ID 不完整，请检查 /api/chat 的响应。");
        }
        currentId = data.chatId;
        rememberSelection();
        answer.textContent = data.answer;
        status.textContent = "";
      } catch (error) {
        status.textContent = error instanceof TypeError ? "无法连接聊天服务，请检查连接后重试。" : error.message;
        input.value = question;
      } finally {
        // 首问结束后，从后端刷新会话标题。
        if (newConversation) {
          try {
            chats = await readHistory("/api/conversations");
          } catch {
            storageNotice.textContent = "历史列表更新失败，请刷新重试。";
          }
        }
        setBusy(false);
      }
    };
  </script>
